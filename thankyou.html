<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | CloudTotus</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="./public/logo/icon32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Umami analytics (preserved) -->
  <script defer src="https://analytics2.cajuclc.com/script.js" data-website-id="dbaaac40-4074-4cf0-a102-f0fc9a183a11"></script>
  <style>
    .ty-page {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: calc(var(--nav-h) + 40px) 22px 80px;
      background: var(--grad-brand);
      overflow: hidden;
    }
    .ty-content { position: relative; z-index: 2; max-width: 680px; }
    .ty-icon { width: 132px; height: 132px; margin: 0 auto 28px; animation: fadeUp .7s ease both; }
    .ty-icon img { width: 100%; height: 100%; }
    .ty-title {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 800;
      margin-bottom: 18px;
      animation: fadeUp .7s ease .05s both;
    }
    .ty-message {
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      opacity: .9;
      margin-bottom: 36px;
      animation: fadeUp .7s ease .1s both;
    }
    .ty-actions { animation: fadeUp .7s ease .15s both; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container" style="justify-content:center;">
      <a href="index.html" class="nav-logo" aria-label="CloudTotus home">
        <img src="./public/logo/cloudtotus_light_h.png" alt="CloudTotus">
      </a>
    </div>
  </nav>

  <section class="ty-page">
    <div class="hero-bg" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <div class="grid-overlay"></div>
    </div>
    <div class="ty-content">
      <div class="ty-icon">
        <img src="./public/message-received.svg" alt="Message received">
      </div>
      <h1 class="ty-title">Thank you for<br><span class="gradient-text">contacting us!</span></h1>
      <p class="ty-message">We received your message and will get back to you as soon as possible.</p>
      <div class="ty-actions">
        <a href="index.html" class="btn btn-ghost">← Return to Home</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 CloudTotus. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
